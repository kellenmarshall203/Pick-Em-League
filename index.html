  .modal-btn-row{display:flex;gap:10px;}

    flex:1;background:transparent;border:1px solid #ccc4b3;color:#6b6459;
    border-radius:5px;padding:10px 0;font-size:13px;font-weight:600;cursor:pointer;font-family:inherit;

  .modal-submit-btn{
    flex:1;background:var(--green);border:none;color:var(--cream);

    transform:translateX(-50%);

    color:var(--cream);
    padding:10px 16px;
    border-radius:10px;

<body>
<div id="app"></div>

<script>
// ===================== CONFIG =====================
const SUPABASE_URL = "https://qmbyibktwbolcnqscdrt.supabase.co";
const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InFtYnlpYmt0d2JvbGNucXNjZHJ0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODg1OTA0OTYsImV4cCI6MjEwNDE2NjQ5Nn0.mqEMclT2R-49h1bZ7hBKCsOrASumlZtUMviAlIumdEg";
const COMMISH_PIN = "1625";

// ===================== SUPABASE HELPERS =====================
async function sbFetch(path, options = {}) {
  const res = await fetch(`${SUPABASE_URL}/rest/v1/${path}`, {
    ...options,
    headers: {
      apikey: SUPABASE_KEY,
      Authorization: `Bearer ${SUPABASE_KEY}`,
      "Content-Type": "application/json",
      ...(options.headers || {}),
    },
  });
  if (!res.ok) {
    const text = await res.text().catch(() => "");
    throw new Error(`Supabase error ${res.status}: ${text}`);
  }
  if (res.status === 204) return null;
  return res.json();
}

async function getWeeks() {
  const rows = await sbFetch("weeks?select=week&order=week.asc");
  return rows.map((r) => r.week);
}

async function insertWeek(week) {
  await sbFetch("weeks?on_conflict=week", {
    method: "POST",
    headers: { Prefer: "resolution=merge-duplicates" },
    body: JSON.stringify([{ week }]),
  });
}

async function getWeekData(week) {
  const rows = await sbFetch(`week_data?week=eq.${week}&select=data`);
  return rows.length ? rows[0].data : null;
}

async function upsertWeekData(week, data) {
  await sbFetch("week_data?on_conflict=week", {
    method: "POST",
    headers: { Prefer: "resolution=merge-duplicates" },
    body: JSON.stringify([{ week, data }]),
  });
}

async function getPlayers() {
  const rows = await sbFetch("players?select=name&order=name.asc");
  return rows.map((r) => r.name);
}

async function insertPlayer(name) {
  await sbFetch("players?on_conflict=name", {
    method: "POST",
    headers: { Prefer: "resolution=merge-duplicates" },
    body: JSON.stringify([{ name }]),
  });
}

async function getPicksForWeek(week) {
  const rows = await sbFetch(`picks?week=eq.${week}&select=player,data`);
  const obj = {};
  rows.forEach((r) => (obj[r.player] = normalizePickRecord(r.data)));
  return obj;
}

// Old rows stored a flat { gameId: side } object. New rows store
// { selections: { gameId: side }, submitted: bool }. This makes both work.
function normalizePickRecord(raw) {
  if (raw && typeof raw === "object" && "selections" in raw) {
    return { selections: raw.selections || {}, submitted: !!raw.submitted };
  }
  return { selections: raw || {}, submitted: false };
}

async function upsertPick(week, player, data) {
  await sbFetch("picks?on_conflict=week,player", {
    method: "POST",
    headers: { Prefer: "resolution=merge-duplicates" },
    body: JSON.stringify([{ week, player, data }]),
  });
}

// ===================== STATE =====================
function emptyGame(id) {
  return { id, away: "", home: "", winner: null, final: false };
}
function blankWeekData() {
  return {
    college: [1, 2, 3, 4, 5].map((n) => emptyGame("c" + n + "-" + Date.now() + "-" + n)),
    nfl: [1, 2, 3, 4, 5].map((n) => emptyGame("n" + n + "-" + Date.now() + "-" + n)),
  };
}

const state = {
  tab: "slate",
  weeks: [1],
  week: 1,
  weekData: { college: [], nfl: [] },
  players: [],
  activePlayer: null,
  picks: {},
  loading: true,
  isCommish: false,
  showPinModal: false,
  toastMsg: null,
  standingsRows: null,
  reviewExpanded: {},
};

function flash(msg, ms) {
  state.toastMsg = msg;
  render();
  setTimeout(() => {
    state.toastMsg = null;
    render();
  }, ms || 4500);
}

// ===================== LOAD =====================
async function initialLoad() {
  state.loading = true;
  render();
  try {
    let weeks = await getWeeks();
    if (!weeks || weeks.length === 0) {
      await insertWeek(1);
      await upsertWeekData(1, blankWeekData());
      weeks = [1];
    }
    state.weeks = weeks;
    state.players = await getPlayers();
    try {
      const saved = localStorage.getItem("pickem-active-player");
      if (saved && state.players.includes(saved)) state.activePlayer = saved;
    } catch (e) {}
    await loadWeekData(state.week);
  } catch (err) {
    console.error("Initial load failed", err);
    flash("Couldn't connect to the database. Check your connection.");
  } finally {
    state.loading = false;
    render();
  }
}

async function loadWeekData(w) {
  try {
    let data = await getWeekData(w);
    if (!data || !data.college || !data.nfl) {
      data = blankWeekData();
      await upsertWeekData(w, data);
    }
    state.weekData = data;
    state.picks = await getPicksForWeek(w);
  } catch (err) {
    console.error("Week load failed", err);
    state.weekData = blankWeekData();
    state.picks = {};
    flash("Couldn't load this week's data.");
  }
}

// ===================== ACTIONS =====================
async function selectWeek(w) {
  state.week = Number(w);
  state.loading = true;
  render();
  await loadWeekData(state.week);
  state.loading = false;
  render();
}

async function startNewWeek() {
  const next = Math.max(...state.weeks) + 1;
  const fresh = blankWeekData();
  state.loading = true;
  render();
  try {
    await insertWeek(next);
    await upsertWeekData(next, fresh);
    state.weeks = [...state.weeks, next].sort((a, b) => a - b);
    state.week = next;
    state.weekData = fresh;
    state.picks = {};
    state.tab = "slate";
    flash(`Week ${next} created — fill in the slate below`);
  } catch (err) {
    console.error(err);
    flash("Couldn't create the new week.");
  } finally {
    state.loading = false;
    render();
  }
}

function requestCommish() {
  if (state.isCommish) {
    state.isCommish = false;
    if (state.tab === "review") state.tab = "picks";
    render();
    return;
  }
  state.showPinModal = true;
  render();
}

async function submitPin(pin) {
  if (pin === COMMISH_PIN) {
    state.isCommish = true;
    state.showPinModal = false;
    flash("Commissioner mode on");
  } else {
    flash("Wrong PIN");
  }
  render();
}

function cancelPin() {
  state.showPinModal = false;
  render();
}

function switchTab(tab) {
  state.tab = tab;
  render();
}

async function updateGame(league, gameId, patch) {
  state.weekData[league] = state.weekData[league].map((g) =>
    g.id === gameId ? { ...g, ...patch } : g
  );
  render();
  try {
    await upsertWeekData(state.week, state.weekData);
  } catch (err) {
    console.error(err);
    flash("Save failed — check connection");
  }
}

function updateTeamName(league, gameId, side, value) {
  updateGame(league, gameId, { [side]: value });
}

async function selectPlayer(name) {
  state.activePlayer = name;
  try {
    localStorage.setItem("pickem-active-player", name);
  } catch (e) {}
  render();
}

function switchPlayer() {
  state.activePlayer = null;
  render();
}

async function joinPool() {
  const input = document.getElementById("name-input");
  if (!input) return;
  const trimmed = input.value.trim();
  if (!trimmed) return;
  try {
    if (!state.players.includes(trimmed)) {
      await insertPlayer(trimmed);
      state.players = [...state.players, trimmed];
    }
    await selectPlayer(trimmed);
  } catch (err) {
    console.error(err);
    flash("Couldn't join: " + err.message);
  }
}

async function makePick(gameId, side) {
  if (!state.activePlayer) return;
  const current = state.picks[state.activePlayer] || { selections: {}, submitted: false };
  if (current.submitted) {
    flash("Your picks are locked in for this week.");
    return;
  }
  const updated = { selections: { ...current.selections, [gameId]: side }, submitted: false };
  state.picks = { ...state.picks, [state.activePlayer]: updated };
  render();
  try {
    await upsertPick(state.week, state.activePlayer, updated);
  } catch (err) {
    console.error(err);
    flash("Save failed — check connection");
  }
}

async function submitPicks() {
  if (!state.activePlayer) return;
  const current = state.picks[state.activePlayer] || { selections: {}, submitted: false };
  if (current.submitted) return;
  const updated = { selections: current.selections, submitted: true };
  state.picks = { ...state.picks, [state.activePlayer]: updated };
  render();
  try {
    await upsertPick(state.week, state.activePlayer, updated);
    flash("Picks locked in for the week!");
  } catch (err) {
    console.error(err);
    flash("Couldn't submit — check connection");
  }
}

// ===================== STANDINGS COMPUTE =====================
async function computeStandings() {
  state.standingsRows = null;
  render();
  if (state.players.length === 0) {
    state.standingsRows = [];
    render();
    return;
  }
  const totals = {};
  state.players.forEach((p) => (totals[p] = { name: p, wins: 0, losses: 0, weekly: {} }));

  for (const w of state.weeks) {
    let data;
    try {
      data = (await getWeekData(w)) || blankWeekData();
    } catch (e) {
      data = blankWeekData();
    }
    const allGames = [...data.college, ...data.nfl].filter((g) => g.final);
    let picks;
    try {
      picks = await getPicksForWeek(w);
    } catch (e) {
      picks = {};
    }
    state.players.forEach((p) => {
      const myPicks = (picks[p] && picks[p].selections) || {};
      let wWins = 0,
        wLosses = 0;
      allGames.forEach((g) => {
        const pick = myPicks[g.id];
        if (!pick) return;
        if (pick === g.winner) wWins++;
        else wLosses++;
      });
      totals[p].wins += wWins;
      totals[p].losses += wLosses;
      totals[p].weekly[w] = { wins: wWins, losses: wLosses };
    });
  }

  const arr = Object.values(totals).sort((a, b) => {
    if (b.wins !== a.wins) return b.wins - a.wins;
    return a.losses - b.losses;
  });
  state.standingsRows = arr;
  render();
}

// ===================== RENDER =====================
function esc(s) {
  return (s || "").replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
}

function renderHeader() {
  return `
    <header>
      <div class="header-top">
        <div>
          <div class="brand-eyebrow">PICK 'EM</div>
          <div class="brand-title">THE LEAGUE</div>
        </div>
        <button class="commish-btn ${state.isCommish ? "active" : ""}" onclick="requestCommish()">
          ${state.isCommish ? "🔓 Commissioner" : "🔒 Commissioner"}
        </button>
      </div>
      <div class="week-row">
        <select id="week-select" onchange="selectWeek(this.value)">
          ${state.weeks
            .map((w) => `<option value="${w}" ${w === state.week ? "selected" : ""}>Week ${w}</option>`)
            .join("")}
        </select>
        ${state.isCommish ? `<button class="add-week-btn" onclick="startNewWeek()">+ Start new week</button>` : ""}
      </div>
    </header>
  `;
}

function renderPinModal() {
  if (!state.showPinModal) return "";
  return `
    <div class="modal-overlay" onclick="cancelPin()">
      <div class="modal-box" onclick="event.stopPropagation()">
        <h3 class="modal-title">Enter commissioner PIN</h3>
        <input id="pin-input" class="modal-input" type="password" inputmode="numeric" maxlength="4" placeholder="••••"
          onkeydown="if(event.key==='Enter') submitPin(this.value)" />
        <div class="modal-btn-row">
          <button class="modal-cancel-btn" onclick="cancelPin()">Cancel</button>
          <button class="modal-submit-btn" onclick="submitPin(document.getElementById('pin-input').value)">Unlock</button>
        </div>
      </div>
    </div>
  `;
}

function renderSlateRow(league, g, i) {
  return `
    <div class="game-card-edit">
      <span class="game-num">${i + 1}</span>
      <div class="edit-fields">
        <input class="team-input" placeholder="Away team" value="${esc(g.away)}"
          onblur="updateTeamName('${league}','${g.id}','away',this.value)" />
        <span class="at-sym">@</span>
        <input class="team-input" placeholder="Home team" value="${esc(g.home)}"
          onblur="updateTeamName('${league}','${g.id}','home',this.value)" />
      </div>
      <div class="result-row">
        <span class="result-label">Winner:</span>
        <button class="winner-btn ${g.winner === "away" ? "active" : ""}" ${!g.away ? "disabled" : ""}
          onclick="updateGame('${league}','${g.id}',{winner:'away',final:true})">${g.away ? esc(g.away) : "Away"}</button>
        <button class="winner-btn ${g.winner === "home" ? "active" : ""}" ${!g.home ? "disabled" : ""}
          onclick="updateGame('${league}','${g.id}',{winner:'home',final:true})">${g.home ? esc(g.home) : "Home"}</button>
        ${g.final ? `<button class="clear-btn" onclick="updateGame('${league}','${g.id}',{winner:null,final:false})">Clear</button>` : ""}
      </div>
    </div>
  `;
}

function renderSlateTab() {
  if (!state.isCommish) {
    return `
      <div class="player-gate">
        <h2 class="gate-title">The Slate is locked</h2>
        <p class="hint">Only the commissioner can build the weekly matchups and enter results.</p>
        <button class="join-btn" onclick="requestCommish()">🔒 Unlock with PIN</button>
      </div>
    `;
  }
  return `
    <div class="setup-banner">
      <strong>The Slate — Week ${state.week}</strong>
      <p style="margin:4px 0 0;font-size:12.5px;line-height:1.5;">
        Type team names directly into the boxes below. Everything saves automatically.
        Once a game is final, tap the winning team to grade it.
      </p>
    </div>
    <section>
      <div class="league-header-row">
        <h2 class="league-header">College</h2>
        <span class="league-sub">5 games</span>
      </div>
      ${state.weekData.college.map((g, i) => renderSlateRow("college", g, i)).join("")}
    </section>
    <section>
      <div class="league-header-row">
        <h2 class="league-header">NFL</h2>
        <span class="league-sub">5 games</span>
      </div>
      ${state.weekData.nfl.map((g, i) => renderSlateRow("nfl", g, i)).join("")}
    </section>
  `;
}

function renderPickCard(g, i, selections, submitted) {
  const picked = selections[g.id];
  const locked = g.final || submitted;
  return `
    <div class="pick-card">
      <span class="game-num" style="position:static;">${i + 1}</span>
      <div class="pick-buttons">
        <button class="pick-btn ${picked === "away" ? "active" : ""} ${g.final && g.winner === "away" ? "correct" : ""} ${g.final && picked === "away" && g.winner !== "away" ? "wrong" : ""}"
          ${locked ? "disabled" : ""} onclick="makePick('${g.id}','away')">${esc(g.away)}</button>
        <button class="pick-btn ${picked === "home" ? "active" : ""} ${g.final && g.winner === "home" ? "correct" : ""} ${g.final && picked === "home" && g.winner !== "home" ? "wrong" : ""}"
          ${locked ? "disabled" : ""} onclick="makePick('${g.id}','home')">${esc(g.home)}</button>
      </div>
    </div>
  `;
}

function renderPicksTab() {
  if (!state.activePlayer) {
    return `
      <div class="player-gate">
        <h2 class="gate-title">Who's picking?</h2>
        <p class="hint">Pick your name, or join the pool if this is your first week.</p>
        <div class="player-list">
          ${state.players.map((p) => `<button class="player-chip" onclick="selectPlayer('${esc(p).replace(/'/g, "\\'")}')">${esc(p)}</button>`).join("")}
        </div>
        <div class="join-row">
          <input id="name-input" class="join-input" placeholder="Enter your name" onkeydown="if(event.key==='Enter') joinPool()" />
          <button class="join-btn" onclick="joinPool()">Join pool</button>
        </div>
      </div>
    `;
  }

  const record = state.picks[state.activePlayer] || { selections: {}, submitted: false };
  const selections = record.selections;
  const submitted = record.submitted;
  const collegeGames = state.weekData.college.filter((g) => g.away && g.home);
  const nflGames = state.weekData.nfl.filter((g) => g.away && g.home);
  const hasAny = collegeGames.length > 0 || nflGames.length > 0;
  const totalGames = collegeGames.length + nflGames.length;
  const pickedCount = [...collegeGames, ...nflGames].filter((g) => selections[g.id]).length;
  const allPicked = totalGames > 0 && pickedCount === totalGames;

  return `
    <div class="player-bar">
      <span>Picking as <strong>${esc(state.activePlayer)}</strong></span>
      <button class="switch-btn" onclick="switchPlayer()">Switch player</button>
    </div>
    ${
      submitted
        ? `<div class="setup-banner">🔒 <strong>Picks locked in for Week ${state.week}.</strong> You can't change them anymore this week.</div>`
        : ""
    }
    ${
      !hasAny
        ? `<p class="hint">No matchups posted yet for this week. Check back soon.</p>`
        : `
      ${
        collegeGames.length
          ? `<section><div class="league-header-row"><h2 class="league-header">College</h2></div>${collegeGames
              .map((g, i) => renderPickCard(g, i, selections, submitted))
              .join("")}</section>`
          : ""
      }
      ${
        nflGames.length
          ? `<section><div class="league-header-row"><h2 class="league-header">NFL</h2></div>${nflGames
              .map((g, i) => renderPickCard(g, i, selections, submitted))
              .join("")}</section>`
          : ""
      }
      ${
        !submitted
          ? `<button class="join-btn" style="width:100%;padding:14px 0;font-size:15px;margin-top:6px;" ${
              allPicked ? "" : "disabled"
            } onclick="submitPicks()">
              ${allPicked ? "Submit picks — " + pickedCount + "/" + totalGames : "Pick all games to submit (" + pickedCount + "/" + totalGames + ")"}
            </button>`
          : ""
      }
    `
    }
  `;
}

function toggleReviewExpand(playerName) {
  state.reviewExpanded[playerName] = !state.reviewExpanded[playerName];
  render();
}

function renderReviewTab() {
  if (!state.isCommish) {
    return `
      <div class="player-gate">
        <h2 class="gate-title">Review is locked</h2>
        <p class="hint">Only the commissioner can see who has submitted picks.</p>
        <button class="join-btn" onclick="requestCommish()">🔒 Unlock with PIN</button>
      </div>
    `;
  }

  const collegeGames = state.weekData.college.filter((g) => g.away && g.home);
  const nflGames = state.weekData.nfl.filter((g) => g.away && g.home);
  const allGames = [...collegeGames, ...nflGames];
  const totalGames = allGames.length;

  if (state.players.length === 0) {
    return `<p class="hint">No contestants have joined the pool yet.</p>`;
  }
  if (totalGames === 0) {
    return `<p class="hint">Post matchups on The Slate first, then come back here to track submissions.</p>`;
  }

  const submittedCount = state.players.filter((p) => (state.picks[p] || {}).submitted).length;

  return `
    <div class="setup-banner">
      <strong>Week ${state.week} submissions</strong>
      <p style="margin:4px 0 0;font-size:12.5px;line-height:1.5;">
        ${submittedCount} of ${state.players.length} contestants have locked in their picks.
        Tap a name to see their picks before everyone else can.
      </p>
    </div>
    ${state.players
      .map((p) => {
        const record = state.picks[p] || { selections: {}, submitted: false };
        const pickedCount = allGames.filter((g) => record.selections[g.id]).length;
        const expanded = !!state.reviewExpanded[p];
        return `
        <div class="game-card-edit" style="cursor:pointer;" onclick="toggleReviewExpand('${esc(p).replace(/'/g, "\\'")}')">
          <div style="display:flex;align-items:center;justify-content:space-between;gap:8px;">
            <strong>${esc(p)}</strong>
            <span style="display:flex;align-items:center;gap:8px;">
              <span class="league-sub">${pickedCount}/${totalGames}</span>
              <span class="finalBadge" style="font-size:10px;font-weight:700;border-radius:3px;padding:2px 6px;
                ${record.submitted ? "border:1px solid #3a7d44;color:#245029;background:#e5f2e6;" : "border:1px solid #b3ab9a;color:#6b6459;"}">
                ${record.submitted ? "SUBMITTED" : "NOT YET"}
              </span>
              <span style="color:#a39c8c;">${expanded ? "▾" : "▸"}</span>
            </span>
          </div>
          ${
            expanded
              ? `<div style="margin-top:10px;display:flex;flex-direction:column;gap:6px;" onclick="event.stopPropagation()">
                  ${allGames
                    .map((g) => {
                      const pick = record.selections[g.id];
                      return `<div style="display:flex;justify-content:space-between;font-size:13px;padding:4px 0;border-top:1px solid #eee7d8;">
                        <span>${esc(g.away)} @ ${esc(g.home)}</span>
                        <span style="font-weight:700;color:${pick ? "var(--green)" : "#b3ab9a"};">${pick ? esc(g[pick]) : "— no pick —"}</span>
                      </div>`;
                    })
                    .join("")}
                </div>`
              : ""
          }
        </div>
      `;
      })
      .join("")}
  `;
}

function renderStandingsTab() {
  if (state.standingsRows === null) {
    computeStandings();
    return `<div class="loading-box">Tallying results…</div>`;
  }
  if (state.standingsRows.length === 0) {
    return `<p class="hint">No contestants yet. Standings appear once players join and picks are graded.</p>`;
  }
  const rows = state.standingsRows;
  return `
    <h2 class="league-header">Season standings</h2>
    <div class="standings-table">
      <div class="standings-header-row">
        <span class="st-rank">#</span>
        <span class="st-name">Player</span>
        <span class="st-col">W</span>
        <span class="st-col">L</span>
        <span class="st-col">Pct</span>
      </div>
      ${rows
        .map((r, i) => {
          const total = r.wins + r.losses;
          const pct = total ? (r.wins / total).toFixed(3).slice(1) : ".000";
          return `
          <div class="standings-row ${i === 0 && total > 0 ? "leader" : ""}">
            <span class="st-rank">${i + 1}</span>
            <span class="st-name">${esc(r.name)}</span>
            <span class="st-col">${r.wins}</span>
            <span class="st-col">${r.losses}</span>
            <span class="st-col">${pct}</span>
          </div>`;
        })
        .join("")}
    </div>
    <h3 class="weekly-header">Weekly breakdown</h3>
    <div style="overflow-x:auto;">
      <table class="weekly-table">
        <thead>
          <tr>
            <th>Player</th>
            ${state.weeks.map((w) => `<th>Wk ${w}</th>`).join("")}
          </tr>
        </thead>
        <tbody>
          ${rows
            .map(
              (r) => `
            <tr>
              <td class="name">${esc(r.name)}</td>
              ${state.weeks
                .map((w) => {
                  const wk = r.weekly[w] || { wins: 0, losses: 0 };
                  return `<td class="val">${wk.wins}-${wk.losses}</td>`;
                })
                .join("")}
            </tr>`
            )
            .join("")}
        </tbody>
      </table>
    </div>
  `;
}

function renderTabBar() {
  const items = [
    { key: "slate", label: state.isCommish ? "The Slate" : "The Slate 🔒" },
    { key: "picks", label: "Picks" },
    { key: "standings", label: "Standings" },
  ];
  if (state.isCommish) {
    items.push({ key: "review", label: "Review" });
  }
  return `
    <nav class="tab-bar">
      ${items
        .map(
          (it) =>
            `<button class="tab-btn ${state.tab === it.key ? "active" : ""}" onclick="switchTab('${it.key}')">${it.label}</button>`
        )
        .join("")}
    </nav>
  `;
}

function render() {
  const app = document.getElementById("app");
  let mainContent;
  if (state.loading) {
    mainContent = `<div class="loading-box">Loading scoreboard…</div>`;
  } else if (state.tab === "slate") {
    mainContent = renderSlateTab();
  } else if (state.tab === "picks") {
    mainContent = renderPicksTab();
  } else if (state.tab === "review") {
    mainContent = renderReviewTab();
  } else {
    mainContent = renderStandingsTab();
  }

  app.innerHTML = `
    ${renderHeader()}
    ${renderPinModal()}
    <main>${mainContent}</main>
    ${state.toastMsg ? `<div class="toast">${esc(state.toastMsg)}</div>` : ""}
    ${renderTabBar()}
  `;

  const pinInput = document.getElementById("pin-input");
  if (pinInput) pinInput.focus();
}

// Reset standings cache whenever week list or players change so it recomputes
const origRender = render;

// Safety net: never hang forever on loading
setTimeout(() => {
  if (state.loading) {
    state.loading = false;
    render();
  }
}, 8000);

// ===================== INIT =====================
initialLoad();
</script>
</body>
</html>
